# Path 1 — SoundMetrics only.
#   docker compose -f docker-compose.soundmetrics.yml up -d --build
name: soundmetrics-lab

services:
  api:
    build: ./soundmetrics-api
    container_name: sm-api
    expose:
      - "8000"
    networks:
      - sm-net

  ui:
    build: ./soundmetrics-ui
    container_name: sm-ui
    ports:
      - "3000:3000"
    depends_on:
      - api
    networks:
      - sm-net

  artifactory:
    build: ./fake-jfrog
    container_name: sm-jfrog
    ports:
      - "8081:8081"
    networks:
      - sm-net

networks:
  sm-net:
    driver: bridge
